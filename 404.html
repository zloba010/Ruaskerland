<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">Похоже, такая страница не существует или вы перешли по неверно написанной URL-ссылке.</p>
        <a href="https://zloba010.github.io/Ruaskerland/" class="back-button">Вернуться на главную</a>
    </div>
  <style>/* Общие стили */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    cursor: url("https://cdn.glitch.global/1584c047-6111-4e8b-98d1-b725da2fb99f/export202410090327563397.png?v=1728434546803"),default;
}

body {
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Контейнер с ошибкой */
.error-container {
    text-align: center;
    background-color: #fff;
    padding: 50px;
    border-radius: 10px;
    box-shadow: 0 3px 37px rgb(0 0 0);
    width: 100%;
    max-width: 400px;
}

/* Стиль для кода ошибки */
.error-code {
    font-size: 100px;
    color: #e74c3c;
    margin-bottom: 20px;
}

/* Стиль для текста ошибки */
.error-message {
    font-size: 18px;
    color: #555;
    margin-bottom: 30px;
}

/* Кнопка возврата */
.back-button {
    display: inline-block;
    padding: 15px 30px;
    background-color: #3498db;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    border-radius: 5px;
    transition: background-color 0.3s ease;
}

.back-button:hover {
    background-color: #2980b9;
}</style>
</body>
</html>
