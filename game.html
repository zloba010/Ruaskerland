<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Падающие Частицы</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div id="particle-container"></div>
    <div class="controls">
        <select id="particle-selector">
            <option value="leaf">Листья</option>
            <option value="snow">Снег</option>
            <option value="stars">Звезды</option>
            <!-- Добавьте другие опции по необходимости -->
        </select>
        <button id="change-particles">Сменить частички</button>
        <button id="toggle-particles">Включить частички</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
